# GitHub Actions UI에서 수동 실행(Run workflow)만. push로는 안 돈다.
# 배포는 GitHub-hosted → SSH 가 아니라, prod VM의 self-hosted runner가
# 로컬에서 git pull + deploy-prod.sh 를 실행한다 (인바운드 SSH 불필요).
#
# Runner: Settings → Actions → Runners 에서 [self-hosted, production] 등록
# Vars(선택): DEPLOY_PATH (기본 /opt/backend)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Rebuild targets (empty=auto from last commit on main, "all", or e.g. "user-service api-gateway")'
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve compose services
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/compose-services-from-paths.sh

          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          MANUAL="${{ github.event.inputs.services || '' }}"
          if [[ -n "${MANUAL}" ]]; then
            SERVICES="${MANUAL}"
          else
            BEFORE="${{ github.event.before || '' }}"
            if [[ "${{ github.event_name }}" == "push" && -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              mapfile -t FILES < <(git diff --name-only "${BEFORE}" "${{ github.sha }}")
            else
              mapfile -t FILES < <(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            fi
            if [[ ${#FILES[@]} -eq 0 ]]; then
              SERVICES="all"
            else
              SERVICES="$(./scripts/compose-services-from-paths.sh "${FILES[@]}")"
            fi
          fi

          SERVICES="$(trim "${SERVICES}")"
          echo "services=${SERVICES}"
          if [[ -z "${SERVICES}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "services=" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: select
    if: needs.select.outputs.skip != 'true'
    # prod VM에 등록한 self-hosted runner (라벨 production)
    runs-on: [self-hosted, production]
    timeout-minutes: 45
    environment: production

    steps:
      - name: Pull and deploy on VM
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/backend' }}
          SERVICES: ${{ needs.select.outputs.services }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Deploying services: ${SERVICES} @ ${TARGET_SHA}"
          cd "${DEPLOY_PATH}"
          git fetch --prune origin
          git checkout main
          git reset --hard "${TARGET_SHA}"
          chmod +x scripts/deploy-prod.sh scripts/compose-services-from-paths.sh
          # shellcheck disable=SC2086
          ./scripts/deploy-prod.sh ${SERVICES}
