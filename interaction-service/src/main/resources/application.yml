server:
  port: 8084
spring:
  application:
    name: interaction-service
  config:
    import: optional:classpath:application-logging-defaults.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/backend_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      host: localhost
      port: 6379
      hash-key: post_view:pending

jwt:
  issuer: blog-josik-collector  # 토큰 발행자 식별자
  # HS512 알고리즘을 안전하게 사용하기 위해 최소 64글자 이상의 임의 문자열 권장
  # 아래는 Base64 인코딩된 예시 키입니다. (실제 운영시에는 강력한 키로 생성하세요)
  client-secret: dGhpcy1pcy1hLXZlcnktbG9uZy1hbmQtc2VjdXJlLWtleS1mb3Itand0LXNpZ25pbmctNTEyLWJpdHMtc3Ryb25nLWVub3VnaA==
  expiry-seconds: 7200  # 액세스 토큰 만료 시간 (2시간 = 7200초)

springdoc:
  use-fqn: true  # Fully Qualified Name 사용
  api-docs:
    path: /interaction/v3/api-docs
  swagger-ui:
    path: /interaction/swagger-ui

elasticsearch:
  host: localhost
  port: 9200
  scheme: https
  username: elastic
  password: elastic
  fingerprint:
  index-name: techblog-posts-v1

post-view-flusher:
  schedule-delay: 30000  # 30초 (밀리초 단위) - Redis에 누적된 view_count를 DB로 flush하는 주기
  initial-delay: 30000   # 애플리케이션 기동 직후 첫 flush 까지의 지연

post-count-sync-worker:
  schedule-delay: 30000  # 30초 (밀리초 단위) - posts 카운트를 Elasticsearch로 upsert하는 주기
  initial-delay: 30000   # 애플리케이션 기동 직후 첫 sync 까지의 지연
  post-batch-size: 100   # 한 번의 bulk upsert 에 포함할 post 최대 개수