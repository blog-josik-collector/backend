# 서버 배포용. 로컬 인프라는 docker-backend/docker-compose.yml 을 그대로 쓴다.
# 사용:
#   cp .env.example .env
#   docker compose -f docker-compose.prod.yml up -d --build

name: backend-prod

services:
  postgres:
    image: postgres:15.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  elasticsearch:
    build:
      context: ./docker-backend/elasticsearch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend

  user-service:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: user-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  interaction-service:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: interaction-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      ES_HOST: elasticsearch
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  integrated-api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: integrated-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ES_HOST: elasticsearch
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - backend

  integrated-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ES_HOST: elasticsearch
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
      CHROME_BINARY: /usr/bin/chromium
      CHROME_DRIVER: /usr/bin/chromedriver
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  api-gateway:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      USER_SERVICE_URI: http://user-service:8080
      INTERACTION_SERVICE_URI: http://interaction-service:8083
      INTEGRATED_API_URI: http://integrated-api:8081
    depends_on:
      - user-service
      - interaction-service
      - integrated-api
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  backend:
    driver: bridge
